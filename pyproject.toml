[project]
name = "contributor-insights"
version = "0.1.0"
description = "GitHub contributor velocity insights with Gemini-generated narratives"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "limits>=5.8.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.23.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
