# Defaults to fixture data and recorded narratives: no credentials needed.
# For live mode, set DATA_SOURCE/LLM_MODE and the keys in .env (see README).
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_SOURCE: ${DATA_SOURCE:-fixtures}
      LLM_MODE: ${LLM_MODE:-recorded}
      # Separate databases so fixture and live data never mix.
      DB_PATH: /app/data/${DATA_SOURCE:-fixtures}.db
    volumes:
      - insights-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  insights-data:
